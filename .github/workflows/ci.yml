name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/go/go.mod
          cache-dependency-path: conformance/go/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: conformance/typescript/package-lock.json
      - name: Require Node.js 22.23.4 or newer
        run: |
          node -e 'const [major, minor, patch] = process.versions.node.split(".").map(Number); if (!(major > 22 || (major === 22 && (minor > 23 || (minor === 23 && patch >= 4))))) { console.error("Node.js " + process.versions.node + " is older than 22.23.4"); process.exit(1); }'
      - run: ./conformance/verify.sh
