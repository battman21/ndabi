[package]
name = "ndabi-showdown"
version = "0.9.0"
edition = "2021"
publish = false

# Keep this research prototype outside the product workspace. Its SQLite dependency and benchmark
# profile must not change White Tree's build graph or feature unification.
[workspace]
members = [
    "crates/ndabi-mongodb",
    "crates/ndabi-postgres",
    "crates/ndabi-postgres-v1",
    "crates/ndabi-protocol",
    "crates/ndabi-session",
    "crates/ndabi-write",
]

