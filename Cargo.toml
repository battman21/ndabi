[workspace]
members = [
    "crates/ndabi-mongodb",
    "crates/ndabi-mongodb-v1",
    "crates/ndabi-postgres",
    "crates/ndabi-postgres-v1",
    "crates/ndabi-protocol",
    "crates/ndabi-session",
    "crates/ndabi-supabase-batch-session-v1",
    "crates/ndabi-supabase-indexed-batch-session-v1",
    "crates/ndabi-supabase-packed-session-v1",
    "crates/ndabi-supabase-range-session-v1",
    "crates/ndabi-supabase-session-v1",
    "crates/ndabi-supabase-v1",
    "crates/ndabi-write",
    "tools/registry-proof",
]
exclude = ["research/showdown"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/battman21/ndabi"
rust-version = "1.92"

[profile.release]
codegen-units = 1
lto = "thin"
