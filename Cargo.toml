[dependencies]
blake3 = { version = "1.8", features = ["zeroize"] }
crc32fast = "1.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
olx-core = { version = "=0.1.0", path = "../../crates/olx-core", features = ["store-fixtures", "dev-software-signing"] }
tempfile = "3"
arrow-array = "58.3"
tokio = { version = "1.52", features = ["rt-multi-thread"] }
postgres = "0.19"
tokio-postgres = "0.7"
futures-util = "0.3"
subtle = "2.6"
zeroize = "1.9"
ndabi-mongodb = { path = "crates/ndabi-mongodb" }
ndabi-postgres = { path = "crates/ndabi-postgres" }
ndabi-postgres-v1 = { path = "crates/ndabi-postgres-v1" }
ndabi-protocol = { path = "crates/ndabi-protocol" }
ndabi-session = { path = "crates/ndabi-session" }
ndabi-write = { path = "crates/ndabi-write" }
mongodb = { version = "3.8", features = ["sync"] }
rcgen = "0.14"
rustls = "0.23"

[profile.release]
codegen-units = 1
lto = "thin"
